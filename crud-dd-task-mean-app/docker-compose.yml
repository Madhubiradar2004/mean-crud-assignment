services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    image: madhubiradar2004/mean-backend:latest
    container_name: backend
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongo:27017/mean-db
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  frontend:
    image: madhubiradar2004/mean-frontend:latest
    container_name: frontend
    restart: unless-stopped
    ports:
      - "4200:80"

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mongo_data:

      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mongo_data:
